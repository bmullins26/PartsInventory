<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4e78"><title>Technician Inventory</title><style>:root{--bg:#f3f5f7;--text:#17212b;--muted:#687580;--accent:#1f4e78;--line:#dfe4e8;--ok:#e6f3e8;--warn:#fff1d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;background:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0 0 9px}.tabs{display:flex;gap:8px;margin-bottom:9px}.tab{flex:1}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.search{width:100%;font-size:17px;padding:14px;border:1px solid #cbd3da;border-radius:12px}.controls{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}select,button{min-height:42px;border:1px solid #cbd3da;border-radius:9px;background:#fff;padding:8px 11px;font-size:14px}button{font-weight:600;color:var(--accent)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.categories{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px}.cat{white-space:nowrap;padding:8px 12px;border:1px solid #cbd3da;border-radius:20px;background:#fff;font-size:13px;font-weight:700;color:var(--accent)}.cat.active{background:var(--accent);color:#fff}.statusbar{font-size:13px;color:var(--muted);margin-top:8px}.section-title{font-size:18px;font-weight:800;margin:16px 2px 8px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid var(--line)}.needed-title{background:var(--warn)}.verified-title{background:var(--ok)}main{padding:12px;max-width:850px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}.card.verified{background:var(--ok);opacity:.76}.card.short{background:var(--warn)}.head{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line);background:#f8fafb}.card.verified .head{background:#dcebdd}.card.short .head{background:#fff0d3}.check{width:25px;height:25px;min-width:25px}.title{font-size:16px;font-weight:700;word-break:break-word;flex:1}.tag{font-size:11px;font-weight:800;white-space:nowrap}.oktag{color:#356b3c}.warntag{color:#8a5a00}.body{padding:10px 14px}.qtybox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}.qtybox>div{background:#f7f9fa;border:1px solid var(--line);border-radius:10px;padding:9px}.qtylabel{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}.qtyvalue{font-size:20px;font-weight:800}input.qty{width:100%;font-size:18px;padding:10px;border:1px solid #cbd3da;border-radius:8px;margin-top:3px}.description{font-size:15px;line-height:1.4;padding:4px 0 10px}.field{padding:7px 0;border-bottom:1px solid #eef1f3}.label{display:block;font-size:12px;color:var(--muted);font-weight:600}.value{font-size:15px;line-height:1.35;word-break:break-word}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px;max-height:82vh;overflow:auto}.needrow{padding:10px 0;border-bottom:1px solid #e4e7ea}.file{display:none}</style></head><body><header><h1>Technician Inventory</h1><div class="tabs"><button id="partsTab" class="tab active">📦 Parts</button><button id="toolsTab" class="tab">🧰 Tools</button></div><input id="search" class="search" type="search" placeholder="Search part number or description..." autocomplete="off" autocorrect="off" spellcheck="false"><div class="controls"><select id="category" style="display:none"></select><select id="field"></select><button id="show">Show: All</button><button id="clear">Clear Search</button><button id="needed" class="primary">Needed</button><button id="export" class="primary">Export Needed</button><button id="importBtn">📥 Import Parts Still Needed</button><input id="file" class="file" type="file" accept=".csv,.pdf,text/csv,application/pdf"></div><div id="categories" class="categories"></div><div id="status" class="statusbar"></div></header><main id="results"></main><div id="modal" class="modal"><div class="sheet"><button id="close">Close</button><h2 id="modalTitle">Needed</h2><div id="neededList"></div><br><button id="download" class="primary">Export CSV</button></div></div><script src="parts-data-1.js"></script><script src="parts-data-2.js"></script><script src="parts-data-3.js"></script><script src="parts-data-4.js"></script><script src="parts-data-5.js"></script><script src="parts-data-6.js"></script><script src="tools-data-01.js"></script><script src="tools-data-02.js"></script><script src="tools-data-03.js"></script><script src="tools-data-04.js"></script><script src="tools-data-05.js"></script><script>const PARTS=[...PARTS_1,...PARTS_2,...PARTS_3,...PARTS_4,...PARTS_5,...PARTS_6],TOOLS=[...(typeof TOOLS_01!=='undefined'?TOOLS_01:[]),...(typeof TOOLS_02!=='undefined'?TOOLS_02:[]),...(typeof TOOLS_03!=='undefined'?TOOLS_03:[]),...(typeof TOOLS_04!=='undefined'?TOOLS_04:[]),...(typeof TOOLS_05!=='undefined'?TOOLS_05:[])];let section='parts',mode='all',category='all',qty={};const $=id=>document.getElementById(id),search=$('search'),field=$('field'),results=$('results'),status=$('status'),showBtn=$('show');try{qty=JSON.parse(localStorage.getItem('technicianInventory_v1')||'{}')||{}}catch(e){}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function data(){return section==='parts'?PARTS:TOOLS}function key(r){return section+'|'+String(r.MfgNmbr||r.IndNmbr||r.Item||'')+'|'+String(r.JsNmbr||r.Source||'')}function req(r){const n=section==='parts'?parseFloat(String(r.MinStndrdTrckQty??'').replace(/,/g,'')):parseFloat(String(r.Qty??'').replace(/,/g,''));return Number.isFinite(n)?Math.max(0,n):0}function have(r){const n=parseFloat(qty[key(r)]);return Number.isFinite(n)?Math.max(0,n):0}function ok(r){return have(r)>=req(r)}function save(){localStorage.setItem('technicianInventory_v1',JSON.stringify(qty))}function cols(){return section==='parts'?['MfgNmbr','Description']:['Category','Item','Qty','Brand','Info','Link','Source']}function configure(){field.innerHTML='<option value="all">All fields</option>'+cols().map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');$('category').style.display=section==='tools'?'block':'none';search.placeholder=section==='parts'?'Search part number or description...':'Search tool, category, brand, info...';$('partsTab').classList.toggle('active',section==='parts');$('toolsTab').classList.toggle('active',section==='tools');buildCats();render()}function buildCats(){if(section!=='tools'){$('categories').innerHTML='';return}const cats=[...new Set(TOOLS.map(r=>String(r.Category||'General')).filter(Boolean))].sort((a,b)=>a.localeCompare(b));$('category').innerHTML='<option value="all">All Categories</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');$('categories').innerHTML='<button class="cat '+(category==='all'?'active':'')+'" data-cat="all">ALL ('+TOOLS.length+')</button>'+cats.map(c=>'<button class="cat '+(category===c?'active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+' ('+TOOLS.filter(r=>String(r.Category||'General')===c).length+')</button>').join('')}function inCat(r){return section!=='tools'||category==='all'||String(r.Category||'General')===category}function matches(r){const C=cols(),q=search.value.trim().toLowerCase(),f=field.value;return !q||(f==='all'?C.some(c=>String(r[c]??'').toLowerCase().includes(q)):String(r[f]??'').toLowerCase().includes(q))}function card(r){const m=req(r),h=have(r),is=ok(r),n=Math.max(0,m-h),title=section==='parts'?r.MfgNmbr:r.Item;return '<section class="card '+(is?'verified':'short')+'"><div class="head"><input class="check" type="checkbox" '+(is?'checked':'')+' disabled><div class="title">'+esc(title||'Item')+'</div>'+(is?'<span class="tag oktag">VERIFIED ✓</span>':'<span class="tag warntag">NEED '+n+'</span>')+'</div><div class="body"><div class="qtybox"><div><span class="qtylabel">Required Qty</span><div class="qtyvalue">'+esc(m)+'</div></div><div><span class="qtylabel">Quantity On Hand</span><input class="qty" type="number" min="0" step="1" inputmode="numeric" data-id="'+esc(key(r))+'" value="'+(qty[key(r)]!==undefined?esc(qty[key(r)]):'')+'" placeholder="Enter qty"></div></div>'+(section==='parts'?'<div class="description">'+esc(r.Description||'—')+'</div>':cols().map(c=>'<div class="field"><span class="label">'+esc(c)+'</span><div class="value">'+esc(r[c]||'—')+'</div></div>').join(''))+'</div></section>'}function render(){const D=data(),base=D.filter(inCat),filtered=base.filter(matches),needed=filtered.filter(r=>!ok(r)),verified=filtered.filter(ok);showBtn.textContent=mode==='all'?'Show: All':mode==='needed'?'Show: Needed':'Show: Verified';let visible=mode==='needed'?needed:mode==='verified'?verified:filtered;status.textContent=visible.length+' shown • '+base.filter(ok).length+' of '+base.length+' verified';if(!visible.length){results.innerHTML='<div class="empty"><strong>No '+(section==='parts'?'parts':'tools')+' found</strong><br>Try another search or filter.</div>';return}if(mode==='all'){results.innerHTML=(needed.length?'<div class="section-title needed-title">🟡 STILL NEEDED ('+needed.length+')</div>'+needed.map(card).join(''):'')+(verified.length?'<div class="section-title verified-title">🟢 VERIFIED ('+verified.length+')</div>'+verified.map(card).join(''):'')}else{results.innerHTML=visible.map(card).join('')}document.querySelectorAll('.qty').forEach(i=>i.addEventListener('change',e=>{const v=parseFloat(e.target.value);if(e.target.value==='')delete qty[e.target.dataset.id];else qty[e.target.dataset.id]=Math.max(0,Math.floor(Number.isFinite(v)?v:0));save();render()}))}function neededList(){return data().filter(inCat).map(r=>({r,need:Math.max(0,req(r)-have(r))})).filter(x=>x.need>0)}function openNeeded(){const a=neededList();$('modalTitle').textContent=section==='parts'?'Parts Needed':'Tools Needed';$('neededList').innerHTML=a.length?a.map(x=>'<div class="needrow"><strong>'+esc(section==='parts'?x.r.MfgNmbr:x.r.Item)+'</strong><br>'+esc(x.r.Description||x.r.Info||'')+'<br>Required: '+req(x.r)+' • On Hand: '+have(x.r)+' • <strong>Qty Needed: '+x.need+'</strong></div>').join(''):'<p>Everything meets the required quantity. ✓</p>';$('modal').style.display='flex'}function exportCSV(){const a=neededList();if(!a.length){alert('No '+(section==='parts'?'parts':'tools')+' are currently needed.');return}const h=section==='parts'?['Part Number','Description','Required Qty','Qty On Hand','Qty Needed']:['Category','Tool','Required Qty','Qty On Hand','Qty Needed','Brand','Info','Link','Source'];const v=a.map(x=>section==='parts'?[x.r.MfgNmbr,x.r.Description,req(x.r),have(x.r),x.need]:[x.r.Category,x.r.Item,req(x.r),have(x.r),x.need,x.r.Brand,x.r.Info,x.r.Link,x.r.Source]),cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"',csv=[h,...v].map(r=>r.map(cell).join(',')).join('\r\n'),a1=document.createElement('a');a1.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a1.download=(section==='parts'?'Parts_Needed_':'Tools_Needed_')+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a1);a1.click();a1.remove();setTimeout(()=>URL.revokeObjectURL(a1.href),1000)}function parseCSV(s){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<s.length;i++){const ch=s[i],nx=s[i+1];if(ch==='"'){if(quote&&nx==='"'){cell+='"';i++}else quote=!quote}else if(ch===','&&!quote){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&nx==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}else cell+=ch}if(cell||row.length){row.push(cell);rows.push(row)}return rows}function applyStillNeeded(stillNeeded){const next={};PARTS.forEach(r=>{const k=key(r),part=String(r.MfgNmbr||'').trim().toLowerCase(),required=req(r),need=stillNeeded[part]??0;next[k]=Math.max(0,required-need)});Object.keys(qty).forEach(k=>{if(k.startsWith('tools|'))next[k]=qty[k]});qty=next;save();mode='all';search.value='';field.value='all';render();alert('Imported Parts Still Needed. '+Object.keys(stillNeeded).length+' parts remain to be found. Everything else was checked off and moved to VERIFIED.')}function importCSV(file){const reader=new FileReader();reader.onload=()=>{try{const rows=parseCSV(String(reader.result||''));if(rows.length<2)throw Error('No inventory rows found');const H=rows[0].map(x=>x.trim().toLowerCase()),p=H.findIndex(x=>['part number','partnumber','mfgnmbr','mfg number','mfg'].includes(x)),n=H.findIndex(x=>['qty needed','quantity needed','needed'].includes(x));if(p<0||n<0)throw Error('This file must contain Part Number and Qty Needed columns.');const stillNeeded={};for(let i=1;i<rows.length;i++){const part=(rows[i][p]||'').trim(),need=parseFloat(String(rows[i][n]||'').replace(/,/g,''));if(part&&Number.isFinite(need))stillNeeded[part.toLowerCase()]=Math.max(0,Math.floor(need))}applyStillNeeded(stillNeeded)}catch(e){alert('Import failed: '+e.message)}};reader.readAsText(file)}async function importPDF(file){try{const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const data=await file.arrayBuffer(),doc=await pdfjs.getDocument({data}).promise,lines=[];for(let p=1;p<=doc.numPages;p++){const page=await doc.getPage(p),tc=await page.getTextContent(),items=tc.items.map(i=>({text:i.str,x:i.transform[4],y:i.transform[5]})).filter(i=>i.text.trim());const groups={};items.forEach(i=>{const y=Math.round(i.y);(groups[y]||(groups[y]=[])).push(i)});Object.keys(groups).sort((a,b)=>b-a).forEach(y=>lines.push(groups[y].sort((a,b)=>a.x-b.x).map(i=>i.text).join(' ')))}const stillNeeded={},masters=PARTS.map(r=>({part:String(r.MfgNmbr||'').trim(),lower:String(r.MfgNmbr||'').trim().toLowerCase()})).filter(x=>x.part);for(const line of lines){const low=line.toLowerCase();const found=masters.find(x=>low.includes(x.lower));if(!found)continue;const after=line.slice(low.indexOf(found.lower)+found.part.length);const nums=(after.match(/\b\d+(?:\.\d+)?\b/g)||[]);let need=nums.length?parseFloat(nums[nums.length-1]):1;if(!Number.isFinite(need)||need<0)need=1;stillNeeded[found.lower]=Math.max(0,Math.floor(need))}if(!Object.keys(stillNeeded).length)throw Error('No master-list part numbers were found in the PDF. Make sure the PDF contains the Part Number column.');applyStillNeeded(stillNeeded)}catch(e){alert('PDF import failed: '+e.message)}}$('partsTab').onclick=()=>{section='parts';mode='all';category='all';configure()};$('toolsTab').onclick=()=>{section='tools';mode='all';category='all';configure()};showBtn.onclick=()=>{mode=mode==='all'?'needed':mode==='needed'?'verified':'all';render()};$('clear').onclick=()=>{search.value='';mode='all';render();search.focus()};$('needed').onclick=openNeeded;$('export').onclick=exportCSV;$('close').onclick=()=>{$('modal').style.display='none'};$('download').onclick=exportCSV;$('importBtn').onclick=()=>{section='parts';$('file').value='';$('file').click()};$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const isPDF=f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf');if(isPDF)importPDF(f);else importCSV(f)};$('category').onchange=e=>{category=e.target.value;render()};$('categories').onclick=e=>{const b=e.target.closest('.cat');if(b){category=b.dataset.cat;render()}};search.addEventListener('input',render);field.addEventListener('change',render);configure();</script></body></html>
