<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4e78"><title>Technician Inventory</title><style>:root{--a:#1f4e78;--bg:#f3f5f7;--line:#dfe4e8;--ok:#e6f3e8;--warn:#fff1d9;--muted:#687580}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;background:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0 0 9px}.tabs,.controls{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:9px}.tab{flex:1}.tab.active,button.primary{background:var(--a);color:#fff;border-color:var(--a)}button,select,input{font-size:14px}button,select{min-height:42px;border:1px solid #cbd3da;border-radius:9px;background:#fff;padding:8px 11px;font-weight:600;color:var(--a)}.search{width:100%;font-size:17px;padding:14px;border:1px solid #cbd3da;border-radius:12px}.controls{margin-top:9px}.status{font-size:13px;color:var(--muted);margin-top:8px}main{padding:12px;max-width:850px;margin:auto}.titlebar{font-size:18px;font-weight:800;margin:16px 2px 8px;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}.neededTitle{background:var(--warn)}.verifiedTitle{background:var(--ok)}.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}.card.short{background:var(--warn)}.card.verified{background:var(--ok);opacity:.8}.head{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}.head b{flex:1;word-break:break-word}.tag{font-size:11px;font-weight:800;white-space:nowrap}.ok{color:#356b3c}.bad{color:#8a5a00}.body{padding:10px 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#f7f9fa;border:1px solid var(--line);border-radius:10px;padding:9px}.label{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}.big{font-size:20px;font-weight:800}.qty{width:100%;font-size:18px;padding:9px;border:1px solid #cbd3da;border-radius:8px;margin-top:3px}.desc{padding:9px 0 3px;font-size:15px;line-height:1.4}.empty{text-align:center;padding:40px;color:var(--muted)}.file{display:none}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px;max-height:82vh;overflow:auto}.row{padding:10px 0;border-bottom:1px solid #e4e7ea}</style></head><body><header><h1>Technician Inventory</h1><div class="tabs"><button id="partsTab" class="tab active">📦 Parts</button><button id="toolsTab" class="tab">🧰 Tools</button></div><input id="search" class="search" type="search" placeholder="Search part number or description..." autocomplete="off"><div class="controls"><select id="field"></select><button id="show">Show: All</button><button id="clear">Clear Search</button><button id="needed" class="primary">Needed</button><button id="exportNeed" class="primary">Export Needed</button><button id="exportHave" class="primary">Export Inventory</button><button id="importBtn">📥 Import Parts Still Needed</button><input id="file" class="file" type="file" accept=".csv,.pdf,text/csv,application/pdf"></div><div id="status" class="status"></div></header><main id="results"></main><div id="modal" class="modal"><div class="sheet"><button id="close">Close</button><h2 id="modalTitle">Parts Needed</h2><div id="list"></div></div></div><script src="parts-data-1.js"></script><script src="parts-data-2.js"></script><script src="parts-data-3.js"></script><script src="parts-data-4.js"></script><script src="parts-data-5.js"></script><script src="parts-data-6.js"></script><script src="tools-data-01.js"></script><script src="tools-data-02.js"></script><script src="tools-data-03.js"></script><script src="tools-data-04.js"></script><script src="tools-data-05.js"></script><script>const PARTS=[...PARTS_1,...PARTS_2,...PARTS_3,...PARTS_4,...PARTS_5,...PARTS_6],TOOLS=[...(typeof TOOLS_01<'undefined'?TOOLS_01:[]),...(typeof TOOLS_02<'undefined'?TOOLS_02:[]),...(typeof TOOLS_03<'undefined'?TOOLS_03:[]),...(typeof TOOLS_04<'undefined'?TOOLS_04:[]),...(typeof TOOLS_05<'undefined'?TOOLS_05:[])];let section='parts',mode='all',qty={};const $=id=>document.getElementById(id),search=$('search'),field=$('field'),results=$('results');try{qty=JSON.parse(localStorage.getItem('technicianInventory_v1')||'{}')||{}}catch(e){}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const data=()=>section==='parts'?PARTS:TOOLS;const key=r=>section+'|'+String(r.MfgNmbr||r.IndNmbr||r.Item||'')+'|'+String(r.JsNmbr||r.Source||'');const req=r=>{let n=parseFloat(String(section==='parts'?r.MinStndrdTrckQty:r.Qty??'').replace(/,/g,''));return Number.isFinite(n)?Math.max(0,n):0};const have=r=>{let n=parseFloat(qty[key(r)]);return Number.isFinite(n)?Math.max(0,n):0};const checked=r=>qty[key(r)]!==undefined&&Number.isFinite(parseFloat(qty[key(r)]));const ok=r=>have(r)>=req(r);const save=()=>localStorage.setItem('technicianInventory_v1',JSON.stringify(qty));const cols=()=>section==='parts'?['MfgNmbr','Description']:['Category','Item','Qty','Brand','Info','Link','Source'];function configure(){field.innerHTML='<option value="all">All fields</option>'+cols().map(c=>'<option>'+esc(c)+'</option>').join('');search.placeholder=section==='parts'?'Search part number or description...':'Search tool, category, brand, info...';$('partsTab').classList.toggle('active',section==='parts');$('toolsTab').classList.toggle('active',section==='tools');render()}function match(r){let q=search.value.trim().toLowerCase(),f=field.value;return !q||(f==='all'?cols().some(c=>String(r[c]??'').toLowerCase().includes(q)):String(r[f]??'').toLowerCase().includes(q))}function card(r){let m=req(r),h=have(r),good=ok(r),need=Math.max(0,m-h),title=section==='parts'?r.MfgNmbr:r.Item;return '<section class="card '+(good?'verified':'short')+'"><div class="head"><input type="checkbox" disabled '+(good?'checked':'')+'><b>'+esc(title)+'</b><span class="tag '+(good?'ok':'bad')+'">'+(good?'VERIFIED ✓':'NEED '+need)+'</span></div><div class="body"><div class="grid"><div class="box"><span class="label">Required Qty</span><div class="big">'+m+'</div></div><div class="box"><span class="label">Quantity On Hand</span><input class="qty" type="number" min="0" step="1" inputmode="numeric" data-id="'+esc(key(r))+'" value="'+(checked(r)?esc(qty[key(r)]):'')+'" placeholder="Enter qty"></div></div>'+(section==='parts'?'<div class="desc">'+esc(r.Description||'—')+'</div>':'')+'</div></section>'}function render(){let all=data().filter(match),need=all.filter(r=>!ok(r)),good=all.filter(ok),visible=mode==='needed'?need:mode==='verified'?good:all;$('show').textContent='Show: '+(mode==='all'?'All':mode==='needed'?'Needed':'Verified');$('status').textContent=visible.length+' shown • '+data().filter(checked).length+' counted • '+data().filter(ok).length+' of '+data().length+' verified';if(!visible.length){results.innerHTML='<div class="empty">Nothing found.</div>';return}results.innerHTML=mode==='all'?(need.length?'<div class="titlebar neededTitle">🟡 STILL NEEDED ('+need.length+')</div>'+need.map(card).join(''):'')+(good.length?'<div class="titlebar verifiedTitle">🟢 VERIFIED ('+good.length+')</div>'+good.map(card).join(''):''):visible.map(card).join('');document.querySelectorAll('.qty').forEach(i=>i.onchange=e=>{let v=parseFloat(e.target.value);if(e.target.value==='')delete qty[e.target.dataset.id];else qty[e.target.dataset.id]=Math.max(0,Math.floor(Number.isFinite(v)?v:0));save();render()})}function needed(){return data().map(r=>({r,n:Math.max(0,req(r)-have(r))})).filter(x=>x.n>0)}function csv(name,rows){let cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"',text=rows.map(r=>r.map(cell).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}function exportNeeded(){let a=needed();if(!a.length)return alert('No parts are currently needed.');let rows=[['Part Number','Qty Needed','Qty On Hand'],...a.map(x=>[x.r.MfgNmbr,x.n,have(x.r)])];csv('Parts_Needed_'+new Date().toISOString().slice(0,10)+'.csv',rows)}function exportInventory(){let rows=[['Part Number','Qty Needed','Qty On Hand'],...PARTS.map(r=>[r.MfgNmbr,Math.max(0,req(r)-have(r)),have(r)])];csv('Parts_Inventory_'+new Date().toISOString().slice(0,10)+'.csv',rows)}function parseCSV(s){let rows=[],row=[],cell='',q=false;for(let i=0;i<s.length;i++){let c=s[i],n=s[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}function applyNeeded(map){let next={};PARTS.forEach(r=>{let p=String(r.MfgNmbr||'').trim().toLowerCase(),n=map[p]??0;next[key(r)]=Math.max(0,req(r)-n)});Object.keys(qty).filter(k=>k.startsWith('tools|')).forEach(k=>next[k]=qty[k]);qty=next;save();mode='all';render();alert('Imported. '+Object.keys(map).length+' parts still needed; the rest were marked verified.')}function importCSV(file){let rd=new FileReader();rd.onload=()=>{try{let rows=parseCSV(String(rd.result||''));if(rows.length<2)throw Error('No rows found');let h=rows[0].map(x=>x.trim().toLowerCase()),p=h.findIndex(x=>['part number','partnumber','mfgnmbr','mfg number','mfg'].includes(x)),n=h.findIndex(x=>['qty needed','quantity needed','needed'].includes(x));if(p<0||n<0)throw Error('File must contain Part Number and Qty Needed columns.');let m={};for(let i=1;i<rows.length;i++){let part=(rows[i][p]||'').trim(),v=parseFloat(String(rows[i][n]||'').replace(/,/g,''));if(part&&Number.isFinite(v))m[part.toLowerCase()]=Math.max(0,Math.floor(v))}applyNeeded(m)}catch(e){alert('Import failed: '+e.message)}};rd.readAsText(file)}async function importPDF(file){try{let pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';let doc=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise,lines=[];for(let p=1;p<=doc.numPages;p++){let tc=await(await doc.getPage(p)).getTextContent(),items=tc.items.map(i=>({t:i.str,x:i.transform[4],y:Math.round(i.transform[5])})).filter(i=>i.t.trim()),g={};items.forEach(i=>(g[i.y]??=[]).push(i));Object.keys(g).sort((a,b)=>b-a).forEach(y=>lines.push(g[y].sort((a,b)=>a.x-b.x).map(i=>i.t).join(' ')))}let m={},masters=PARTS.map(r=>({p:String(r.MfgNmbr||'').trim(),l:String(r.MfgNmbr||'').trim().toLowerCase()})).filter(x=>x.p);for(let line of lines){let low=line.toLowerCase(),x=masters.find(x=>low.includes(x.l));if(!x)continue;let after=line.slice(low.indexOf(x.l)+x.p.length),nums=after.match(/\b\d+(?:\.\d+)?\b/g)||[],n=nums.length?parseFloat(nums[nums.length-1]):1;m[x.l]=Math.max(0,Math.floor(Number.isFinite(n)?n:1))}if(!Object.keys(m).length)throw Error('No master-list part numbers were found in the PDF.');applyNeeded(m)}catch(e){alert('PDF import failed: '+e.message)}}$('partsTab').onclick=()=>{section='parts';mode='all';configure()};$('toolsTab').onclick=()=>{section='tools';mode='all';configure()};$('show').onclick=()=>{mode=mode==='all'?'needed':mode==='needed'?'verified':'all';render()};$('clear').onclick=()=>{search.value='';mode='all';render()};$('needed').onclick=()=>{let a=needed();$('modalTitle').textContent='Parts Needed';$('list').innerHTML=a.length?a.map(x=>'<div class="row"><b>'+esc(x.r.MfgNmbr)+'</b><br>'+esc(x.r.Description||'')+'<br>Required: '+req(x.r)+' • On Hand: '+have(x.r)+' • <b>Qty Needed: '+x.n+'</b></div>').join(''):'<p>Everything meets minimum. ✓</p>';$('modal').style.display='flex'};$('exportNeed').onclick=exportNeeded;$('exportHave').onclick=exportInventory;$('close').onclick=()=>$('modal').style.display='none';$('importBtn').onclick=()=>{$('file').value='';$('file').click()};$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'))?importPDF(f):importCSV(f)};search.oninput=render;field.onchange=render;configure();</script></body></html>
