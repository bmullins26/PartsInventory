<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#1f4e78"><title>Technician Inventory</title><style>:root{--bg:#f3f5f7;--card:#fff;--text:#17212b;--muted:#687580;--accent:#1f4e78;--line:#dfe4e8;--ok:#e6f3e8;--warn:#fff1d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;background:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0 0 9px}.tabs{display:flex;gap:8px;margin-bottom:9px}.tab{flex:1}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.search{width:100%;font-size:17px;padding:14px;border:1px solid #cbd3da;border-radius:12px}.controls{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}select,button{min-height:42px;border:1px solid #cbd3da;border-radius:9px;background:#fff;padding:8px 11px;font-size:14px}button{font-weight:600;color:var(--accent)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.statusbar{font-size:13px;color:var(--muted);margin-top:8px}main{padding:12px;max-width:850px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}.card.verified{background:var(--ok);opacity:.76}.card.short{background:var(--warn)}.head{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line);background:#f8fafb}.card.verified .head{background:#dcebdd}.card.short .head{background:#fff0d3}.check{width:25px;height:25px;min-width:25px;accent-color:var(--accent)}.part{font-size:16px;font-weight:700;word-break:break-word;flex:1}.tag{font-size:11px;font-weight:800;white-space:nowrap}.oktag{color:#356b3c}.warntag{color:#8a5a00}.body{padding:10px 14px}.qtybox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}.qtybox>div{background:#f7f9fa;border:1px solid var(--line);border-radius:10px;padding:9px}.qtylabel{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}.qtyvalue{font-size:20px;font-weight:800}input.qty{width:100%;font-size:18px;padding:10px;border:1px solid #cbd3da;border-radius:8px;margin-top:3px}.description{font-size:15px;line-height:1.4;padding:4px 0 10px}.field{padding:7px 0;border-bottom:1px solid #eef1f3}.label{display:block;font-size:12px;color:var(--muted);font-weight:600}.value{font-size:15px;line-height:1.35;word-break:break-word}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.warning{font-size:13px;color:#8a5a00;font-weight:700;padding:4px 0 9px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px;max-height:82vh;overflow:auto}.sheet h2{margin:0 0 10px}.needrow{padding:10px 0;border-bottom:1px solid #e4e7ea}.close{float:right}</style></head><body><header><h1>Technician Inventory</h1><div class="tabs"><button id="partsTab" class="tab active">📦 Parts</button><button id="toolsTab" class="tab">🧰 Tools</button></div><input id="search" class="search" type="search" placeholder="Search part number or description..." autocomplete="off" autocorrect="off" spellcheck="false"><div class="controls"><select id="field"></select><button id="show">Show: All</button><button id="clear">Clear Search</button><button id="needed" class="primary">Needed</button><button id="export" class="primary">Export Needed</button></div><div id="status" class="statusbar"></div></header><main id="results"></main><div id="modal" class="modal"><div class="sheet"><button id="close">Close</button><h2 id="modalTitle">Needed</h2><div id="neededList"></div><br><button id="download" class="primary">Export CSV</button></div></div><script src="parts-data-1.js"></script><script src="parts-data-2.js"></script><script src="parts-data-3.js"></script><script src="parts-data-4.js"></script><script src="parts-data-5.js"></script><script src="parts-data-6.js"></script><script src="tools-data-01.js"></script><script src="tools-data-02.js"></script><script src="tools-data-03.js"></script><script src="tools-data-04.js"></script><script src="tools-data-05.js"></script><script>const PARTS=[...PARTS_1,...PARTS_2,...PARTS_3,...PARTS_4,...PARTS_5,...PARTS_6];const TOOLS=[...(typeof TOOLS_01!=='undefined'?TOOLS_01:[]),...(typeof TOOLS_02!=='undefined'?TOOLS_02:[]),...(typeof TOOLS_03!=='undefined'?TOOLS_03:[]),...(typeof TOOLS_04!=='undefined'?TOOLS_04:[]),...(typeof TOOLS_05!=='undefined'?TOOLS_05:[])];let section='parts',mode='all',qty={};const search=document.getElementById('search'),field=document.getElementById('field'),results=document.getElementById('results'),status=document.getElementById('status'),showBtn=document.getElementById('show');try{qty=JSON.parse(localStorage.getItem('technicianInventory_v1')||'{}')||{}}catch(e){}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function data(){return section==='parts'?PARTS:TOOLS}function key(r){return section+'|'+String(r.MfgNmbr||r.IndNmbr||r.Item||'')+'|'+String(r.JsNmbr||r.Source||'')}function required(r){const n=section==='parts'?parseFloat(String(r.MinStndrdTrckQty??'').replace(/,/g,'')):parseFloat(String(r.Qty??'').replace(/,/g,''));return Number.isFinite(n)?Math.max(0,n):0}function have(r){const n=parseFloat(qty[key(r)]);return Number.isFinite(n)?Math.max(0,n):0}function verified(r){return have(r)>=required(r)}function save(){localStorage.setItem('technicianInventory_v1',JSON.stringify(qty))}function columns(){return section==='parts'?['MfgNmbr','Description']:['Category','Item','Qty','Brand','Info','Link','Source']}function configure(){field.innerHTML='<option value="all">All fields</option>'+columns().map(c=>'<option>'+c+'</option>').join('');search.placeholder=section==='parts'?'Search part number or description...':'Search tool, category, brand, info...';document.getElementById('partsTab').classList.toggle('active',section==='parts');document.getElementById('toolsTab').classList.toggle('active',section==='tools');render()}function render(){const D=data(),C=columns(),q=search.value.trim().toLowerCase(),f=field.value,matches=D.filter(r=>{const found=!q||(f==='all'?C.some(c=>String(r[c]??'').toLowerCase().includes(q)):String(r[f]??'').toLowerCase().includes(q)),ok=verified(r);return found&&(mode==='all'||mode==='open'&&!ok||mode==='verified'&&ok)}),count=D.filter(verified).length;showBtn.textContent=mode==='all'?'Show: All':mode==='open'?'Show: Needed':'Show: Verified';status.textContent=matches.length+' shown • '+count+' of '+D.length+' verified';if(!matches.length){results.innerHTML='<div class="empty"><strong>No '+(section==='parts'?'parts':'tools')+' found</strong><br>Try another search or filter.</div>';return}results.innerHTML=matches.map(r=>{const min=required(r),h=have(r),ok=verified(r),need=Math.max(0,min-h),title=section==='parts'?r.MfgNmbr:r.Item;return '<section class="card '+(ok?'verified':'short')+'"><div class="head"><input class="check" type="checkbox" '+(ok?'checked':'')+' disabled><div class="part">'+esc(title||'Item')+'</div>'+(ok?'<span class="tag oktag">VERIFIED ✓</span>':'<span class="tag warntag">NEED '+esc(need)+'</span>')+'</div><div class="body"><div class="qtybox"><div><span class="qtylabel">Required Qty</span><div class="qtyvalue">'+esc(min)+'</div></div><div><span class="qtylabel">Quantity On Hand</span><input class="qty" type="number" min="0" step="1" inputmode="numeric" data-id="'+esc(key(r))+'" value="'+(qty[key(r)]!==undefined?esc(qty[key(r)]):'')+'" placeholder="Enter qty"></div></div>'+(section==='parts'?'<div class="description">'+esc(r.Description||'—')+'</div>':C.map(c=>'<div class="field"><span class="label">'+esc(c)+'</span><div class="value">'+esc(r[c]||'—')+'</div></div>').join(''))+(!ok?'<div class="warning">Cannot mark verified until quantity reaches '+esc(min)+'.</div>':'')+'</div></section>'}).join('');document.querySelectorAll('.qty').forEach(inp=>inp.addEventListener('change',e=>{const v=parseFloat(e.target.value);if(e.target.value==='')delete qty[e.target.dataset.id];else qty[e.target.dataset.id]=Math.max(0,Math.floor(Number.isFinite(v)?v:0));save();render()}))}function needed(){return data().map(r=>({r,need:Math.max(0,required(r)-have(r))})).filter(x=>x.need>0)}function openNeeded(){const a=needed();document.getElementById('modalTitle').textContent=section==='parts'?'Parts Needed':'Tools Needed';document.getElementById('neededList').innerHTML=a.length?a.map(x=>'<div class="needrow"><strong>'+esc(section==='parts'?x.r.MfgNmbr:x.r.Item)+'</strong><br>'+esc(x.r.Description||x.r.Info||'')+'<br>Required: '+required(x.r)+' • On Hand: '+have(x.r)+' • <strong>Qty Needed: '+x.need+'</strong></div>').join(''):'<p>Everything meets the required quantity. ✓</p>';document.getElementById('modal').style.display='flex'}function exportCSV(){const rows=needed();if(!rows.length){alert('No '+(section==='parts'?'parts':'tools')+' are currently needed.');return}let headers=section==='parts'?['Part Number','Description','Minimum Required','Qty On Hand','Qty Needed']:['Category','Item','Required Qty','Qty On Hand','Qty Needed','Brand','Info','Link','Source'];let vals=rows.map(x=>section==='parts'?[x.r.MfgNmbr,x.r.Description,required(x.r),have(x.r),x.need]:[x.r.Category,x.r.Item,required(x.r),have(x.r),x.need,x.r.Brand,x.r.Info,x.r.Link,x.r.Source]);const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"',csv=[headers,...vals].map(row=>row.map(cell).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=(section==='parts'?'Parts_Needed_':'Tools_Needed_')+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.getElementById('partsTab').onclick=()=>{section='parts';mode='all';configure()};document.getElementById('toolsTab').onclick=()=>{section='tools';mode='all';configure()};showBtn.onclick=()=>{mode=mode==='all'?'open':mode==='open'?'verified':'all';render()};document.getElementById('clear').onclick=()=>{search.value='';field.value='all';mode='all';render();search.focus()};document.getElementById('needed').onclick=openNeeded;document.getElementById('export').onclick=exportCSV;document.getElementById('close').onclick=()=>document.getElementById('modal').style.display='none';document.getElementById('download').onclick=exportCSV;search.addEventListener('input',render);field.addEventListener('change',render);configure();</script></body></html>
