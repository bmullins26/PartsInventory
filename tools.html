<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#1f4e78"><title>Technician Tools</title><style>:root{--bg:#f3f5f7;--card:#fff;--text:#17212b;--muted:#687580;--accent:#1f4e78;--line:#dfe4e8;--ok:#e6f3e8;--warn:#fff1d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;background:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0 0 9px}.search{width:100%;font-size:17px;padding:14px;border:1px solid #cbd3da;border-radius:12px}.controls{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}select,button{min-height:42px;border:1px solid #cbd3da;border-radius:9px;background:#fff;padding:8px 11px;font-size:14px}button{font-weight:600;color:var(--accent)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.categories{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px;-webkit-overflow-scrolling:touch}.cat{white-space:nowrap;padding:8px 12px;border:1px solid #cbd3da;border-radius:20px;background:#fff;font-size:13px;font-weight:700;color:var(--accent)}.cat.active{background:var(--accent);color:#fff}.statusbar{font-size:13px;color:var(--muted);margin-top:8px}main{padding:12px;max-width:850px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}.card.verified{background:var(--ok);opacity:.76}.card.short{background:var(--warn)}.head{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line);background:#f8fafb}.card.verified .head{background:#dcebdd}.card.short .head{background:#fff0d3}.check{width:25px;height:25px;min-width:25px}.tool{font-size:16px;font-weight:700;word-break:break-word;flex:1}.tag{font-size:11px;font-weight:800;white-space:nowrap}.oktag{color:#356b3c}.warntag{color:#8a5a00}.body{padding:10px 14px}.qtybox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}.qtybox>div{background:#f7f9fa;border:1px solid var(--line);border-radius:10px;padding:9px}.qtylabel{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}.qtyvalue{font-size:20px;font-weight:800}input.qty{width:100%;font-size:18px;padding:10px;border:1px solid #cbd3da;border-radius:8px;margin-top:3px}.field{padding:7px 0;border-bottom:1px solid #eef1f3}.field:last-child{border:0}.label{display:block;font-size:12px;color:var(--muted);font-weight:600}.value{font-size:15px;line-height:1.35;word-break:break-word}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.warning{font-size:13px;color:#8a5a00;font-weight:700;padding:4px 0 9px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px;max-height:82vh;overflow:auto}.needrow{padding:10px 0;border-bottom:1px solid #e4e7ea}</style></head><body><header><h1>Technician Tools</h1><input id="search" class="search" type="search" placeholder="Search tool, category, brand, info..." autocomplete="off" autocorrect="off" spellcheck="false"><div class="controls"><select id="category"><option value="all">All Categories</option></select><select id="field"><option value="all">All fields</option><option>Category</option><option>Item</option><option>Qty</option><option>Brand</option><option>Info</option><option>PriceHigh</option><option>PriceLow</option><option>Source</option></select><button id="show">Show: All</button><button id="clear">Clear Search</button><button id="needed" class="primary">Tools Needed</button><button id="export" class="primary">Export Tools Needed</button></div><div id="categories" class="categories"></div><div id="status" class="statusbar"></div></header><main id="results"></main><div id="modal" class="modal"><div class="sheet"><button id="close">Close</button><h2>Tools Needed</h2><div id="neededList"></div><br><button id="download" class="primary">Export Tools Needed CSV</button></div></div><script src="tools-data-01.js"></script><script src="tools-data-02.js"></script><script src="tools-data-03.js"></script><script src="tools-data-04.js"></script><script src="tools-data-05.js"></script><script>const DATA=[...TOOLS_01,...TOOLS_02,...TOOLS_03,...TOOLS_04,...TOOLS_05],COLUMNS=['Category','Item','Qty','Brand','Info','PriceHigh','PriceLow','Source'],KEY='technicianToolsQty_v2';let mode='all',category='all',qty={};try{qty=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}const $=id=>document.getElementById(id),search=$('search'),field=$('field'),catSelect=$('category'),catBar=$('categories'),results=$('results'),status=$('status'),showBtn=$('show');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function key(r){return String(r.Item||'')+'|'+String(r.Brand||'')+'|'+String(r.Category||'')}function req(r){const x=String(r.Qty??'1').match(/[0-9]+(?:\.[0-9]+)?/);return x?Math.max(0,Number(x[0])):1}function have(r){const n=Number(qty[key(r)]);return Number.isFinite(n)?Math.max(0,n):0}function ok(r){return have(r)>=req(r)}function save(){localStorage.setItem(KEY,JSON.stringify(qty))}const cats=[...new Set(DATA.map(r=>String(r.Category||'General')).filter(Boolean))].sort((a,b)=>a.localeCompare(b));catSelect.innerHTML='<option value="all">All Categories</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');catBar.innerHTML='<button class="cat active" data-cat="all">ALL <span class="cc">('+DATA.length+')</span></button>'+cats.map(c=>{const n=DATA.filter(r=>String(r.Category||'General')===c).length;return '<button class="cat" data-cat="'+esc(c)+'">'+esc(c)+' <span class="cc">('+n+')</span></button>'}).join('');function matchesCategory(r){return category==='all'||String(r.Category||'General')===category}function filtered(){const q=search.value.trim().toLowerCase(),f=field.value;return DATA.filter(r=>{const hit=!q||(f==='all'?COLUMNS.some(c=>String(r[c]??'').toLowerCase().includes(q)):String(r[f]??'').toLowerCase().includes(q));return matchesCategory(r)&&hit&&(mode==='all'||mode==='needed'&&!ok(r)||mode==='verified'&&ok(r))})}function render(){const a=filtered(),visibleBase=DATA.filter(matchesCategory),v=visibleBase.filter(ok).length;showBtn.textContent=mode==='all'?'Show: All':mode==='needed'?'Show: Needed':'Show: Verified';status.textContent=a.length+' shown • '+v+' of '+visibleBase.length+' verified • '+(category==='all'?'All Categories':category);document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.cat===category));catSelect.value=category;if(!a.length){results.innerHTML='<div class="empty"><strong>No tools found</strong><br>Try another search, category, or filter.</div>';return}results.innerHTML=a.map(r=>{const min=req(r),h=have(r),is=ok(r),need=Math.max(0,min-h);return '<section class="card '+(is?'verified':'short')+'"><div class="head"><input class="check" type="checkbox" '+(is?'checked':'')+' disabled><div class="tool">'+esc(r.Item||'Tool')+'</div>'+(is?'<span class="tag oktag">VERIFIED ✓</span>':'<span class="tag warntag">NEED '+esc(need)+'</span>')+'</div><div class="body"><div class="qtybox"><div><span class="qtylabel">Required Qty</span><div class="qtyvalue">'+esc(min)+'</div></div><div><span class="qtylabel">Quantity On Hand</span><input class="qty" type="number" min="0" step="1" inputmode="numeric" data-id="'+esc(key(r))+'" value="'+(qty[key(r)]!==undefined?esc(qty[key(r)]):'')+'" placeholder="Enter qty"></div></div>'+(!is?'<div class="warning">Cannot mark verified until quantity reaches '+esc(min)+'.</div>':'')+COLUMNS.map(c=>'<div class="field"><span class="label">'+esc(c)+'</span><div class="value">'+esc(r[c]||'—')+'</div></div>').join('')+'</div></section>'}).join('');document.querySelectorAll('.qty').forEach(i=>i.addEventListener('change',e=>{const v=parseFloat(e.target.value);if(e.target.value==='')delete qty[e.target.dataset.id];else qty[e.target.dataset.id]=Math.max(0,Math.floor(v||0));save();render()}))}function needed(){return DATA.filter(matchesCategory).map(r=>({r,need:Math.max(0,req(r)-have(r))})).filter(x=>x.need>0)}function openNeeded(){const a=needed();$('neededList').innerHTML=a.length?a.map(x=>'<div class="needrow"><strong>'+esc(x.r.Item)+'</strong><br>'+esc(x.r.Brand||'')+' • '+esc(x.r.Category||'')+'<br>Required: '+req(x.r)+' • On Hand: '+have(x.r)+' • <strong>Qty Needed: '+x.need+'</strong></div>').join(''):'<p>All tools in this category meet their required quantities. ✓</p>';$('modal').style.display='flex'}function exportCSV(){const rows=needed();if(!rows.length){alert('No tools are currently needed in this category.');return}const h=['Category','Tool','Required Qty','Qty On Hand','Qty Needed','Brand','Info','Price High','Price Low','Source'],vals=rows.map(x=>[x.r.Category,x.r.Item,req(x.r),have(x.r),x.need,x.r.Brand,x.r.Info,x.r.PriceHigh,x.r.PriceLow,x.r.Source]),cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"',csv=[h,...vals].map(r=>r.map(cell).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Tools_Needed_'+(category==='all'?'All_Categories':category.replace(/[^a-z0-9]+/gi,'_'))+'_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catBar.onclick=e=>{const b=e.target.closest('.cat');if(!b)return;category=b.dataset.cat;mode='all';render()};catSelect.onchange=e=>{category=e.target.value;render()};showBtn.onclick=()=>{mode=mode==='all'?'needed':mode==='needed'?'verified':'all';render()};$('clear').onclick=()=>{search.value='';field.value='all';mode='all';render();search.focus()};$('needed').onclick=openNeeded;$('export').onclick=exportCSV;$('close').onclick=()=>$('modal').style.display='none';$('download').onclick=exportCSV;search.addEventListener('input',render);field.addEventListener('change',render);render();</script></body></html>
