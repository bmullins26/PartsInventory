<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#1f4e78"><title>Master Parts Inventory</title><style>
:root{--bg:#f3f5f7;--card:#fff;--text:#17212b;--muted:#687580;--accent:#1f4e78;--line:#dfe4e8;--ok:#e6f3e8;--warn:#fff1d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;background:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0 0 9px}.search{width:100%;font-size:17px;padding:14px;border:1px solid #cbd3da;border-radius:12px}.controls{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}select,button{min-height:42px;border:1px solid #cbd3da;border-radius:9px;background:#fff;padding:8px 11px;font-size:14px}button{font-weight:600;color:var(--accent)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.statusbar{font-size:13px;color:var(--muted);margin-top:8px}main{padding:12px;max-width:850px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}.card.verified{background:var(--ok);opacity:.76}.card.short{background:var(--warn)}.head{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line);background:#f8fafb}.card.verified .head{background:#dcebdd}.card.short .head{background:#fff0d3}.check{width:25px;height:25px;min-width:25px;accent-color:var(--accent)}.part{font-size:16px;font-weight:700;word-break:break-word;flex:1}.tag{font-size:11px;font-weight:800;white-space:nowrap}.oktag{color:#356b3c}.warntag{color:#8a5a00}.body{padding:10px 14px}.qtybox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}.qtybox>div{background:#f7f9fa;border:1px solid var(--line);border-radius:10px;padding:9px}.qtylabel{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}.qtyvalue{font-size:20px;font-weight:800}input.qty{width:100%;font-size:18px;padding:10px;border:1px solid #cbd3da;border-radius:8px;margin-top:3px}.field{padding:7px 0;border-bottom:1px solid #eef1f3}.field:last-child{border:0}.label{display:block;font-size:12px;color:var(--muted);font-weight:600}.value{font-size:15px;line-height:1.35;word-break:break-word}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.warning{font-size:13px;color:#8a5a00;font-weight:700;padding:4px 0 9px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px;max-height:82vh;overflow:auto}.sheet h2{margin:0 0 10px}.needrow{padding:10px 0;border-bottom:1px solid #e4e7ea}.close{float:right}
</style></head><body>
<header><h1>Master Parts Inventory</h1><input id="search" class="search" type="search" placeholder="Search part number, model, description..." autocomplete="off" autocorrect="off" spellcheck="false"><div class="controls"><select id="field"><option value="all">All fields</option><option>MfgNmbr</option><option>IndNmbr</option><option>JsNmbr</option><option>Description</option><option>PriceNormal</option><option>MinStndrdTrckQty</option><option>AutoPricingImmune</option><option>BestCost</option><option>MaxCost</option><option>Notes</option></select><button id="show">Show: All</button><button id="clear">Clear Search</button><button id="partsNeeded" class="primary">Parts Needed</button></div><div id="status" class="statusbar"></div></header><main id="results"></main>
<div id="modal" class="modal"><div class="sheet"><button id="close">Close</button><h2>Parts Needed</h2><div id="neededList"></div><br><button id="download" class="primary">Export Parts Needed CSV</button></div></div>
<script src="parts-data-1.js"></script><script src="parts-data-2.js"></script><script src="parts-data-3.js"></script><script src="parts-data-4.js"></script><script src="parts-data-5.js"></script><script src="parts-data-6.js"></script><script>
const DATA=[...PARTS_1,...PARTS_2,...PARTS_3,...PARTS_4,...PARTS_5,...PARTS_6];const COLUMNS=['MfgNmbr','IndNmbr','JsNmbr','Description','PriceNormal','MinStndrdTrckQty','AutoPricingImmune','BestCost','MaxCost','Notes'];const TITLE='MfgNmbr',MINCOL='MinStndrdTrckQty',KEY='masterPartsQty_v3';const search=document.getElementById('search'),field=document.getElementById('field'),results=document.getElementById('results'),status=document.getElementById('status'),showBtn=document.getElementById('show');let mode='all',qty={};try{qty=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(r){return String(r.MfgNmbr||'')+'|'+String(r.IndNmbr||'')+'|'+String(r.JsNmbr||'')}function minQty(r){const n=parseFloat(String(r[MINCOL]??'').replace(/,/g,''));return Number.isFinite(n)?Math.max(0,n):0}function haveQty(r){const n=parseFloat(qty[id(r)]);return Number.isFinite(n)?Math.max(0,n):0}function verified(r){return haveQty(r)>=minQty(r)}function save(){localStorage.setItem(KEY,JSON.stringify(qty))}
function render(){const q=search.value.trim().toLowerCase(),f=field.value;const matches=DATA.filter(r=>{const found=!q||(f==='all'?COLUMNS.some(c=>String(r[c]??'').toLowerCase().includes(q)):String(r[f]??'').toLowerCase().includes(q));const ok=verified(r);return found&&(mode==='all'||(mode==='open'&&!ok)||(mode==='verified'&&ok))});const count=DATA.filter(verified).length;showBtn.textContent=mode==='all'?'Show: All':mode==='open'?'Show: Needed':'Show: Verified';status.textContent=matches.length+' shown • '+count+' of '+DATA.length+' verified';if(!matches.length){results.innerHTML='<div class="empty"><strong>No parts found</strong><br>Try another search or filter.</div>';return}results.innerHTML=matches.map(r=>{const min=minQty(r),have=haveQty(r),ok=verified(r),need=Math.max(0,min-have);return '<section class="card '+(ok?'verified':'short')+'"><div class="head"><input class="check" type="checkbox" '+(ok?'checked':'')+' disabled><div class="part">'+esc(r[TITLE]||'Part')+'</div>'+(ok?'<span class="tag oktag">VERIFIED ✓</span>':'<span class="tag warntag">NEED '+esc(need)+'</span>')+'</div><div class="body"><div class="qtybox"><div><span class="qtylabel">Minimum Required</span><div class="qtyvalue">'+esc(min)+'</div></div><div><span class="qtylabel">Quantity On Hand</span><input class="qty" type="number" min="0" step="1" inputmode="numeric" data-id="'+esc(id(r))+'" value="'+(qty[id(r)]!==undefined?esc(qty[id(r)]):'')+'" placeholder="Enter qty"></div></div>'+(!ok?'<div class="warning">Cannot mark verified until quantity reaches '+esc(min)+'.</div>':'')+COLUMNS.map(c=>'<div class="field"><span class="label">'+esc(c)+'</span><div class="value">'+esc(r[c]||'—')+'</div></div>').join('')+'</div></section>'}).join('');document.querySelectorAll('.qty').forEach(inp=>inp.addEventListener('change',e=>{const v=parseFloat(e.target.value);if(e.target.value===''||!Number.isFinite(v))delete qty[e.target.dataset.id];else qty[e.target.dataset.id]=Math.max(0,Math.floor(v));save();render()}))}
function needed(){return DATA.map(r=>({r,need:Math.max(0,minQty(r)-haveQty(r))})).filter(x=>x.need>0)}function openNeeded(){const a=needed();document.getElementById('neededList').innerHTML=a.length?a.map(x=>'<div class="needrow"><strong>'+esc(x.r.MfgNmbr)+'</strong><br>'+esc(x.r.Description||'')+'<br>Minimum: '+minQty(x.r)+' • On Hand: '+haveQty(x.r)+' • <strong>Qty Needed: '+x.need+'</strong></div>').join(''):'<p>Everything meets the minimum stock level. ✓</p>';document.getElementById('modal').style.display='flex'}function exportCSV(){const rows=needed();if(!rows.length){alert('No parts are currently needed.');return}const headers=['MfgNmbr','IndNmbr','JsNmbr','Description','Minimum Required','Qty On Hand','Qty Needed','Notes'];const vals=rows.map(x=>[x.r.MfgNmbr,x.r.IndNmbr,x.r.JsNmbr,x.r.Description,minQty(x.r),haveQty(x.r),x.need,x.r.Notes]);const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[headers,...vals].map(row=>row.map(cell).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Parts_Needed_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
showBtn.onclick=()=>{mode=mode==='all'?'open':mode==='open'?'verified':'all';render()};document.getElementById('clear').onclick=()=>{search.value='';field.value='all';mode='all';render();search.focus()};document.getElementById('partsNeeded').onclick=openNeeded;document.getElementById('close').onclick=()=>document.getElementById('modal').style.display='none';document.getElementById('download').onclick=exportCSV;search.addEventListener('input',render);field.addEventListener('change',render);render();
</script></body></html>
