<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#0b5cab"><title>Parts Inventory</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#fff;padding:14px;border-bottom:1px solid #d9dee3}h1{margin:0 0 10px;font-size:22px}.search{width:100%;padding:14px;border:1px solid #aeb7c0;border-radius:12px;font-size:17px}.bar{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.btn{border:1px solid #aeb7c0;background:#fff;border-radius:10px;padding:11px 12px;font-weight:700;font-size:14px}.primary{background:#0b5cab;color:#fff;border-color:#0b5cab}.stats{font-size:13px;color:#5b6670;margin-top:8px}main{padding:10px 12px 30px}.card{background:#fff;border:1px solid #d9dee3;border-radius:13px;padding:13px;margin:9px 0}.card.needed{border-left:5px solid #d88900}.card.ok{border-left:5px solid #2f8f46}.part{font-size:18px;font-weight:800}.desc{margin:4px 0 8px;color:#46515b}.meta{font-size:13px;color:#606b75;margin-bottom:10px}.qty{width:90px;padding:10px;border:1px solid #aeb7c0;border-radius:9px;font-size:18px}.status{margin-top:9px;font-weight:800}.need{color:#9a6200}.good{color:#27763a}.empty{text-align:center;color:#68737d;padding:35px 10px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px;max-height:80vh;overflow:auto}.row{padding:9px 0;border-bottom:1px solid #e2e5e8}.close{float:right}
</style></head><body>
<header><h1>Parts Inventory</h1><input id="search" class="search" autocomplete="off" placeholder="Search part #, description, model..."><div class="bar"><button id="filter" class="btn">Show: All</button><button id="export" class="btn primary">Parts Needed</button></div><div id="stats" class="stats"></div></header><main id="list"></main>
<div id="modal" class="modal"><div class="sheet"><button id="close" class="btn close">Close</button><h2>Parts Needed</h2><div id="neededList"></div><button id="download" class="btn primary">Export CSV</button></div></div>
<script src="parts-data-1.js"></script><script src="parts-data-2.js"></script><script src="parts-data-3.js"></script><script src="parts-data-4.js"></script><script src="parts-data-5.js"></script><script src="parts-data-6.js"></script>
<script>
const PARTS=[...PARTS_1,...PARTS_2,...PARTS_3,...PARTS_4,...PARTS_5,...PARTS_6];
const qty=JSON.parse(localStorage.getItem('partsInventoryQty')||'{}');let filter='all';
const $=id=>document.getElementById(id),search=$('search');
function minimum(p){return Math.max(0,Number(p.MinStndrdTrckQty)||0)}function have(p){return Math.max(0,Number(qty[p.MfgNmbr])||0)}function isOk(p){return have(p)>=minimum(p)}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}
function render(){const q=search.value.trim().toLowerCase();let a=PARTS.filter(p=>{const hit=!q||Object.values(p).join(' ').toLowerCase().includes(q);const ok=isOk(p);return hit&&(filter==='all'||(filter==='needed'&&!ok)||(filter==='verified'&&ok))});$('stats').textContent=`${a.length} shown • ${PARTS.filter(isOk).length} verified • ${PARTS.filter(p=>!isOk(p)).length} needing parts`;$('list').innerHTML=a.length?a.map(p=>{const h=have(p),min=minimum(p),ok=h>=min,need=Math.max(0,min-h);return `<article class="card ${ok?'ok':'needed'}"><div class="part">${esc(p.MfgNmbr)}</div><div class="desc">${esc(p.Description||'')}</div><div class="meta">Minimum required: <b>${min}</b>${!ok?` • Need <b>${need}</b>`:''}</div><label>Qty on hand <input class="qty" inputmode="numeric" type="number" min="0" step="1" data-part="${esc(p.MfgNmbr)}" value="${h}"></label><div class="status ${ok?'good':'need'}">${ok?'✓ VERIFIED — minimum met':'⚠ NEEDS PARTS — minimum not met'}</div></article>`}).join(''):`<div class="empty">No parts found.</div>`;document.querySelectorAll('.qty').forEach(i=>i.addEventListener('input',e=>{qty[e.target.dataset.part]=Math.max(0,Number(e.target.value)||0);localStorage.setItem('partsInventoryQty',JSON.stringify(qty));render()}))}
function needed(){return PARTS.map(p=>({p,need:Math.max(0,minimum(p)-have(p))})).filter(x=>x.need>0)}
function openModal(){const a=needed();$('neededList').innerHTML=a.length?a.map(x=>`<div class="row"><b>${esc(x.p.MfgNmbr)}</b><br>${esc(x.p.Description||'')}<br><b>Qty Needed: ${x.need}</b></div>`).join(''):'<p>Everything meets the minimum stock level. 👍</p>';$('modal').style.display='flex'}
function exportCSV(){const rows=needed();if(!rows.length){alert('No parts are currently needed.');return}const lines=['Part Number,Description,Minimum Required,Qty On Hand,Qty Needed',...rows.map(x=>[x.p.MfgNmbr,x.p.Description||'',minimum(x.p),have(x.p),x.need].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='Parts_Needed.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
search.addEventListener('input',render);$('filter').onclick=()=>{filter=filter==='all'?'needed':filter==='needed'?'verified':'all';$('filter').textContent='Show: '+({all:'All',needed:'Needed',verified:'Verified'}[filter]);render()};$('export').onclick=openModal;$('close').onclick=()=>$('modal').style.display='none';$('download').onclick=exportCSV;render();
</script></body></html>
